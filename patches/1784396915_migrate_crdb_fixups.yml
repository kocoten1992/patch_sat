id: migrate-v243-drop-index-cascade
language: go
rule:
  pattern: |-
    if db.Name() == tagsql.CockroachName {
      _, err = tx.ExecContext(ctx, $CRDB)
    } else {
      _, err = tx.ExecContext(ctx, $PG)
    }
  regex: 'bucket_metainfos_project_id_name_key'
fix: |-
  _, err = tx.ExecContext(ctx, `DROP INDEX IF EXISTS bucket_metainfos_project_id_name_key CASCADE`)
