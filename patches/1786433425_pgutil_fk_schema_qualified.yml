# shared/dbutil/pgutil/query.go cannot parse CockroachDB's foreign key
# definitions. CockroachDB schema-qualifies the referenced table in
# pg_get_constraintdef output:
#
#   FOREIGN KEY (users_a) REFERENCES "pgutil-query-790141748".users(a) ON DELETE CASCADE
#
# while PostgreSQL omits the qualifier when the table is reachable via
# search_path. rxPostgresCompositeForeignKey only accepts a bare identifier, so
# QuerySchema fails with `unable to parse foreign key constraint`.
#
# Upstream never hits this because cockroachutil.OpenUnique creates a whole
# DATABASE per test, leaving search_path at the default. Running a postgres://
# URL against CockroachDB goes through pgutil.OpenUnique instead, which creates
# a named SCHEMA — and that is what triggers the qualification.
#
# The schema prefix is made optional and discarded (non-capturing, so the
# existing matches[1..5] indices are unchanged), and optional double quotes are
# allowed around the table name.
#
# Expected match count: 1

id: pgutil-fk-allow-schema-qualified-reference
language: Go
rule:
  pattern:
    context: 'var rxPostgresCompositeForeignKey = regexp.MustCompile(`REFERENCES ([[:word:]]+)\(([^)]+)\)`)'
    selector: raw_string_literal
  not:
    regex: 'ON UPDATE'
fix: '`REFERENCES (?:(?:"[^"]+"|[[:word:]]+)\.)?"?([[:word:]]+)"?\(([^)]+)\)`'
