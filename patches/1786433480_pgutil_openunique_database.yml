# tempdb.OpenUnique routes on URL prefix, so a postgres:// URL pointed at
# CockroachDB gets pgutil.OpenUnique, which creates a named SCHEMA inside the
# one shared database, while cockroachutil.OpenUnique creates a whole DATABASE.
#
# That single difference is the root cause of a family of problems:
#
#   * CREATE SCHEMA mutates the *database* descriptor, so every parallel test
#     creating its temp schema writes the same descriptor row -> 40001
#     (RETRY_SERIALIZABLE) under load. CREATE DATABASE writes a fresh
#     descriptor and only touches the root namespace.
#   * search_path is no longer the default, so CockroachDB schema-qualifies the
#     referenced table in constraint definitions (patch 1786433425) and the
#     sequence in nextval() column defaults (patch 1786433475).
#   * DROP SCHEMA ... CASCADE stalls where DROP DATABASE does not, which needed
#     the timeout tolerance in patch 1786433442.
#
# Rewrite pgutil.OpenUnique to mirror cockroachutil.OpenUnique: connect to the
# master connstr, CREATE DATABASE, then reconnect with the URL path pointed at
# the new database. Driver stays "pgx" and Implementation stays dbutil.Postgres,
# so the Postgres code path — the thing this fork patches — is unchanged.
#
# The DROP-timeout tolerance from 1786433442 is folded in here, so
# 1786433442 must be REMOVED from `apply`; it edits the same function literal
# and will no longer match.
#
# 1786433425 and 1786433475 are kept: both only *widen* a regex to accept an
# optional qualifier, so they stay correct whether or not the qualifier appears.
# They can be retired later once the test run confirms it never does.
#
# Caveat: like cockroachutil.OpenUnique, cleanup issues DROP DATABASE over the
# connection to that same database. CockroachDB allows this; real PostgreSQL
# does not ("cannot drop the currently open database"). This fork only ever
# points STORJ_TEST_POSTGRES at CockroachDB, so that is an acceptable trade.
#
# Expected match count: 3 (doc comment, function, import block)

id: pgutil-openunique-database-doc
language: Go
rule:
  kind: comment
  regex: '^// OpenUnique opens a postgres database with a temporary unique schema'
fix: '// OpenUnique opens a temporary, uniquely named postgres database, which will be cleaned up'

---
id: pgutil-openunique-database
language: Go
rule:
  kind: function_declaration
  has:
    field: name
    regex: '^OpenUnique$'
  not:
    regex: 'CREATE DATABASE'
fix: |-
  func OpenUnique(ctx context.Context, connstr string, schemaPrefix string) (_ *dbutil.TempDatabase, err error) {
  	// sanity check, because you get an unhelpful error message when this happens
  	if strings.HasPrefix(connstr, "cockroach://") {
  		return nil, errs.New("can't connect to cockroach using pgutil.OpenUnique()! connstr=%q. try tempdb.OpenUnique() instead?", connstr)
  	}

  	schemaName := schemaPrefix + "-" + CreateRandomTestingSchemaName(8)

  	masterDB, err := tagsql.Open(ctx, "pgx", connstr, nil)
  	if err != nil {
  		return nil, errs.New("failed to connect to %q with driver pgx: %w", connstr, err)
  	}
  	defer func() {
  		err = errs.Combine(err, masterDB.Close())
  	}()

  	// check that connection actually worked before trying CREATE DATABASE, to make
  	// troubleshooting (lots) easier
  	if err := masterDB.PingContext(ctx); err != nil {
  		return nil, errs.New("failed to connect to %q with driver pgx: %w", connstr, err)
  	}

  	_, err = masterDB.ExecContext(ctx, "CREATE DATABASE "+QuoteIdentifier(schemaName))
  	if err != nil {
  		return nil, errs.Wrap(err)
  	}

  	cleanup := func(cleanupDB tagsql.DB) error {
  		childCtx, cancel := context.WithTimeout(context2.WithoutCancellation(ctx), 15*time.Second)
  		defer cancel()

  		// HACKFIX: mirrors cockroachutil.OpenUnique. Dropping the database can
  		// stall on CockroachDB; it is better to leak it than to fail the test.
  		_, err := cleanupDB.ExecContext(childCtx, "DROP DATABASE "+QuoteIdentifier(schemaName))
  		if errors.Is(err, context.Canceled) || errors.Is(err, context.DeadlineExceeded) {
  			err = nil
  		}
  		return errs.Wrap(err)
  	}

  	connStrWithDatabase, err := connstrWithDatabase(connstr, schemaName)
  	if err != nil {
  		return nil, errs.Combine(err, cleanup(masterDB))
  	}

  	db, err := tagsql.Open(ctx, "pgx", connStrWithDatabase, nil)
  	if err != nil {
  		return nil, errs.Combine(
  			errs.New("failed to connect to %q with driver pgx: %w", connStrWithDatabase, err),
  			cleanup(masterDB),
  		)
  	}

  	dbutil.Configure(ctx, db, "tmp_postgres", mon)
  	return &dbutil.TempDatabase{
  		DB:             db,
  		ConnStr:        connStrWithDatabase,
  		Schema:         schemaName,
  		Driver:         "pgx",
  		Implementation: dbutil.Postgres,
  		Cleanup:        cleanup,
  	}, nil
  }

  // connstrWithDatabase returns connstr pointed at a different database name.
  func connstrWithDatabase(connstr, database string) (string, error) {
  	connURL, err := url.Parse(connstr)
  	if err != nil {
  		return "", errs.Wrap(err)
  	}
  	connURL.Path = database
  	return connURL.String(), nil
  }

---
# errors and net/url are now used in this file; add the imports.
id: pgutil-db-import-errors-url
language: Go
rule:
  kind: import_declaration
  regex: '"context"'
  not:
    regex: '"net/url"'
fix: |-
  import (
  	"context"
  	"errors"
  	"net/url"
  	"strings"
  	"time"

  	"github.com/jackc/pgx/v5"
  	"github.com/spacemonkeygo/monkit/v3"
  	"github.com/zeebo/errs"

  	"storj.io/common/context2"
  	"storj.io/storj/shared/dbutil"
  	"storj.io/storj/shared/dbutil/dbschema"
  	"storj.io/storj/shared/tagsql"
  )
