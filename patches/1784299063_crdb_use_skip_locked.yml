id: crdb-use-skip-locked
language: Go

rule:
  pattern: getQuery = $SQL

constraints:
  SQL:
    regex: 'DELETE FROM verification_audits v\s+WHERE v\.inserted_at = \(SELECT inserted_at FROM next_row\)'

transform:
  NEW_SQL:
    replace:
      source: $SQL
      replace: 'FOR UPDATE'
      by: 'FOR UPDATE SKIP LOCKED'

fix: |
  getQuery = $NEW_SQL
