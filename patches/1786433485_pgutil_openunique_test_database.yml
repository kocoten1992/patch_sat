id: pgutil-openunique-test-database
language: Go
rule:
  kind: function_declaration
  has:
    field: name
    regex: '^TestTempPostgresDB$'
  not:
    regex: 'current_database'
fix: |-
  func TestTempPostgresDB(t *testing.T) {
  	connstr := dbtest.PickPostgres(t)

  	ctx := testcontext.New(t)
  	defer ctx.Cleanup()

  	prefix := "name#spaced/Test/DB"
  	testDB, err := tempdb.OpenUnique(ctx, zaptest.NewLogger(t), connstr, prefix)
  	require.NoError(t, err)

  	require.Equal(t, "pgx", testDB.Driver)
  	require.Equal(t, dbutil.Postgres, testDB.Implementation)
  	require.Equal(t, tagsql.PostgresName, testDB.Name())

  	// save these so we can close testDB down below and then still try connecting to the same place
  	// (without requiring that the values stay intact in the testDB struct when we close it)
  	driverCopy := testDB.Driver
  	connStrCopy := testDB.ConnStr

  	// assert new test db exists and can be connected to again
  	otherConn, err := tagsql.Open(ctx, driverCopy, connStrCopy, nil)
  	require.NoError(t, err)
  	defer ctx.Check(otherConn.Close)

  	// verify the name matches expectation
  	var dbName string
  	row := otherConn.QueryRowContext(ctx, `SELECT current_database()`)
  	err = row.Scan(&dbName)
  	require.NoErrorf(t, err, "connStr=%q", connStrCopy)
  	require.Truef(t, strings.HasPrefix(dbName, prefix), "Expected prefix of %q for current db name, but found %q", prefix, dbName)

  	// verify there is a db with such a name
  	var count int
  	row = otherConn.QueryRowContext(ctx, `SELECT COUNT(*) FROM pg_database WHERE datname = current_database()`)
  	err = row.Scan(&count)
  	require.NoError(t, err)
  	require.Equalf(t, 1, count, "Expected 1 DB with matching name, but counted %d", count)

  	// close testDB
  	err = testDB.Close()
  	require.NoError(t, err)

  	// make a new connection back to the master connstr just to check that our temp db
  	// really was dropped
  	plainDBConn, err := tagsql.Open(ctx, "pgx", connstr, nil)
  	require.NoError(t, err)
  	defer ctx.Check(plainDBConn.Close)

  	// assert new test db was deleted
  	row = plainDBConn.QueryRowContext(ctx,
  		`SELECT COUNT(*) FROM pg_database WHERE datname = '`+strings.ReplaceAll(dbName, `'`, `''`)+`'`)
  	err = row.Scan(&count)
  	require.NoError(t, err)
  	require.Equalf(t, 0, count, "Expected 0 DB with matching name, but counted %d (deletion failure?)", count)
  }

---
# dbutil is now used in this file; add the import.
id: pgutil-openunique-test-import-dbutil
language: Go
rule:
  kind: import_declaration
  regex: '"storj.io/storj/shared/dbutil/dbtest"'
  not:
    regex: '"storj.io/storj/shared/dbutil"'
fix: |-
  import (
  	"strings"
  	"testing"

  	"github.com/stretchr/testify/require"
  	"go.uber.org/zap/zaptest"

  	"storj.io/common/testcontext"
  	"storj.io/storj/shared/dbutil"
  	"storj.io/storj/shared/dbutil/dbtest"
  	"storj.io/storj/shared/dbutil/tempdb"
  	"storj.io/storj/shared/tagsql"
  )
