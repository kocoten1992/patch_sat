# PostgresAdapter.DeleteAllBucketObjects uses postgresDeleteCTE, which emulates a
# batched delete with a subquery:
#
#   DELETE FROM objects WHERE (project_id, bucket_name) = ($1,$2)
#     AND stream_id IN (SELECT stream_id FROM objects
#                       WHERE (project_id, bucket_name) = ($1,$2) LIMIT $3)
#
# CockroachDB supports DELETE ... LIMIT directly, which is what cockroachDeleteCTE
# uses. The Postgres form is still *correct* on CockroachDB, but it scans the
# bucket twice per batch and the self-join defeats the batching, so deleting a
# large bucket degrades badly.
#
# Switch the Postgres adapter to the CockroachDB CTE. Behaviour is identical;
# only the plan changes.
#
# Expected match count: 1

id: postgres-adapter-crdb-delete-cte
language: Go
rule:
  pattern:
    context: 'func f() { return tagsqlDeleteAllBucketObjects(ctx, p, opts, postgresDeleteCTE) }'
    selector: call_expression
fix: 'tagsqlDeleteAllBucketObjects(ctx, p, opts, cockroachDeleteCTE)'
