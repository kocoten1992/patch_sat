# pgutil.OpenUnique's cleanup gives DropSchema a 15 second budget and RETURNS a
# timeout as an error. cockroachutil.OpenUnique gives DROP DATABASE the same 15
# seconds but explicitly SWALLOWS context.Canceled / context.DeadlineExceeded,
# with a comment noting the drop stalls and that failing the test over it is
# worse than leaking the database.
#
# Upstream only ever needed that workaround on the cockroach path, because
# PostgreSQL drops a schema quickly. Running a postgres:// URL against
# CockroachDB gets the pgutil path with none of the tolerance, so a slow
# DROP SCHEMA surfaces through
#
#   loadSnapshotFromSQL: defer errs.Combine(err, db.Close())
#     -> TempDatabase.Close -> Cleanup -> DropSchema
#
# as e.g. `Version 316 error: timeout: context deadline exceeded`, attributed to
# whichever snapshot happened to be closing. The schema itself loaded fine.
#
# This mirrors the cockroachutil behaviour: the drop is still attempted, a
# timeout is no longer fatal. Leaked "migrate-*" / "load-schema-*" schemas can
# be cleaned up out of band.
#
# Expected match count: 1

id: pgutil-ignore-drop-schema-timeout
language: Go
rule:
  pattern:
    context: |
      func f() {
      	cleanup := func(cleanupDB tagsql.DB) error {
      		childCtx, cancel := context.WithTimeout(context2.WithoutCancellation(ctx), 15*time.Second)
      		defer cancel()
      		return DropSchema(childCtx, cleanupDB, schemaName)
      	}
      }
    selector: func_literal
  not:
    regex: 'DeadlineExceeded'
fix: |-
  func(cleanupDB tagsql.DB) error {
  		childCtx, cancel := context.WithTimeout(context2.WithoutCancellation(ctx), 15*time.Second)
  		defer cancel()

  		// HACKFIX: mirrors cockroachutil.OpenUnique. Dropping a schema can stall
  		// on CockroachDB; it is better to leak the schema than to fail the test.
  		err := DropSchema(childCtx, cleanupDB, schemaName)
  		if errors.Is(err, context.Canceled) || errors.Is(err, context.DeadlineExceeded) {
  			err = nil
  		}
  		return err
  	}

---
# errors.Is is now used in this file; add the import.
id: pgutil-db-import-errors
language: Go
rule:
  kind: import_declaration
  regex: '"context"'
  not:
    regex: '"errors"'
fix: |-
  import (
  	"context"
  	"errors"
  	"strings"
  	"time"

  	"github.com/jackc/pgx/v5"
  	"github.com/spacemonkeygo/monkit/v3"
  	"github.com/zeebo/errs"

  	"storj.io/common/context2"
  	"storj.io/storj/shared/dbutil"
  	"storj.io/storj/shared/dbutil/dbschema"
  	"storj.io/storj/shared/tagsql"
  )
