# Updates shared/dbutil/impl_test.go so the table-driven AS OF SYSTEM TIME
# expectations for dbutil.Postgres match the CockroachDB forms introduced by
# 1786433401, 1786433405, 1786433410 and 1786433415.
#
# Each rule is scoped to a single test function and a single row, and is
# self-disabling: once the row carries the new expectation the regex no longer
# matches, so `apply` will report a count mismatch if this is run twice or if
# upstream changes the row.
#
# Expected total match count: 11

id: impl-test-postgres-aost
language: Go
rule:
  kind: literal_value
  regex: '^\{impl: dbutil\.Postgres, time: time\.Unix\(0, 1620721781789035200\), exp: ""\}$'
  inside:
    stopBy: end
    kind: function_declaration
    regex: 'func TestAsOfSystemTime\('
fix: '{impl: dbutil.Postgres, time: time.Unix(0, 1620721781789035200), exp: " AS OF SYSTEM TIME ''1620721781789035200'' "}'

---
id: impl-test-postgres-aost-bounded
language: Go
rule:
  kind: literal_value
  regex: '^\{impl: dbutil\.Postgres, time: time\.Unix\(0, 1620721781789035200\), exp: ""\}$'
  inside:
    stopBy: end
    kind: function_declaration
    regex: 'func TestAsOfSystemTimeBounded\('
fix: '{impl: dbutil.Postgres, time: time.Unix(0, 1620721781789035200), exp: " AS OF SYSTEM TIME with_min_timestamp(''2021-05-11 08:29:41.789035+00:00'') "}'

