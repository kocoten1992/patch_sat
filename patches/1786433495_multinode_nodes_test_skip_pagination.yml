# multinode/nodes.TestNodesDB "pagination tests" asserts that ListPaged returns
# nodes in insertion order, but the underlying dbx query has no ORDER BY:
#
#   SELECT nodes.id, ... FROM nodes LIMIT ? OFFSET ?
#
# The table is PRIMARY KEY (id) over bytea, and id is testrand.NodeID(), i.e.
# random. PostgreSQL returns a freshly populated heap in insertion order and
# SQLite3 returns rowid order, so the assertion holds on both by accident.
# CockroachDB scans the primary key, so all ten bytes.Compare assertions fail
# with 1 or -1 while TotalCount and len(page.Nodes) pass.
#
# multinodedbtest.Run offers Postgres and Sqlite3 only, and multinode/ contains
# no TiDB references at all — dbx/gen.sh generates -d pgx -d sqlite3 and nothing
# else. So upstream has never run this against a clustered-primary-key store and
# never will; the CockroachDB removal and the TiDB addition both leave multinode
# untouched. There is no upstream pressure to ever fix the missing ORDER BY.
#
# Given that, and that multinode is a separate product from the satellite this
# fork patches, skip the subtest rather than teaching it CockroachDB's ordering.
# The rest of TestNodesDB — Add, Get, List, Update, Remove — still runs.
#
# 1786433490 is the other option: it sorts nodeList by ID so the existing
# assertions line up with primary key order. That keeps the TotalCount /
# PageCount / limit / offset coverage and survives upstream adding ORDER BY id,
# at the cost of making the test real-PostgreSQL-incorrect.
#
# Anchored on the const declaration; the idempotence guard is `not: inside:` on
# the enclosing block because the inserted t.Skip is a sibling of the anchor,
# not a child of it.
#
# Expected match count: 1

id: multinode-nodes-test-skip-pagination
language: Go
rule:
  kind: const_declaration
  regex: 'nodesAmount = 10'
  not:
    inside:
      kind: block
      regex: 't\.Skip'
      stopBy: end
fix: |-
  t.Skip("ListPaged has no ORDER BY; the insertion-order assertions below only hold on PostgreSQL's heap scan and SQLite3's rowid scan, not on CockroachDB's primary key scan. multinode is never run against CockroachDB or TiDB upstream.")

  			const nodesAmount = 10
