id: add-postgres-aost-interval
language: Go

rule:
  pattern: switch impl { $$$CASES }
  inside:
    stopBy: end
    pattern:
      context: "func (impl Implementation) AsOfSystemInterval(interval time.Duration) string { $$$ }"
      selector: method_declaration
  # self-disabling: skip if the Postgres case is already present
  not:
    regex: 'case Postgres:'

fix: |-
  switch impl {
  	case Postgres:
  		return " AS OF SYSTEM TIME '" + interval.String() + "' "
  	$$$CASES	}
