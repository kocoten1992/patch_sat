id: loop-test-postgres-supports-read-timestamp
language: Go
rule:
  pattern:
    context: "func f() { supported := impl == dbutil.Cockroach || impl == dbutil.TiDB }"
    selector: short_var_declaration
  not:
    regex: 'dbutil\.Postgres'
fix: 'supported := impl == dbutil.Cockroach || impl == dbutil.TiDB || impl == dbutil.Postgres'

---
id: loop-test-postgres-requires-fixed-timestamp
language: Go
rule:
  pattern:
    context: "func f() { if impl != dbutil.Cockroach && impl != dbutil.TiDB { return } }"
    selector: binary_expression
  not:
    regex: 'dbutil\.Postgres'
fix: 'impl != dbutil.Cockroach && impl != dbutil.TiDB && impl != dbutil.Postgres'
