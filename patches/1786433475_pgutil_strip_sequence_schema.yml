# CockroachDB schema-qualifies sequence references in a column default:
#
#   nextval('"testmigra_cc081b73e454_m0-bc13a7f4f578dbd7".node_alias_seq')
#
# PostgreSQL emits nextval('node_alias_seq'::regclass), which parseColumnDefault
# already normalises to nextval('node_alias_seq') via typeDescriptorRx.
#
# Because pgutil.OpenUnique gives every temp database a differently-named SCHEMA,
# two snapshots of the SAME schema taken in two temp schemas no longer compare
# equal, and satellite/metabase.TestMigration fails comparing MigrateToLatest
# against TestMigrateToLatest. Upstream never sees this on CockroachDB because
# cockroachutil.OpenUnique creates a DATABASE, leaving search_path alone.
#
# Strip the schema qualifier, which also makes the CockroachDB output match the
# already-normalised PostgreSQL form. Sits alongside the existing "hackity hack"
# normalisations in the same function.
#
# Expected match count: 2

id: pgutil-sequence-schema-regex-var
language: Go
rule:
  kind: var_spec
  regex: 'typeDescriptorRx'
  not:
    regex: 'sequenceSchemaRx'
fix: |-
  typeDescriptorRx         = regexp.MustCompile(`::(:)?[a-zA-Z0-9_ ]+`)
  	sequenceSchemaRx         = regexp.MustCompile(`nextval\('(?:"[^"]*"|[^'".]+)\.`)

---
id: pgutil-strip-sequence-schema
language: Go
rule:
  pattern:
    context: 'func f() { columnDefault = typeDescriptorRx.ReplaceAllString(columnDefault, "") }'
    selector: assignment_statement
  not:
    regex: 'sequenceSchemaRx'
fix: |-
  columnDefault = typeDescriptorRx.ReplaceAllString(columnDefault, "")

  	// hackity hack: cockroach qualifies sequences in defaults with the schema
  	// name, which differs per temp database. strip it.
  	columnDefault = sequenceSchemaRx.ReplaceAllString(columnDefault, "nextval('")
