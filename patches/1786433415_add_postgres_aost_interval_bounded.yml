id: add-postgres-aost-interval-bounded
language: Go

# NOTE: this mirrors the existing `case Cockroach:` branch, which delegates to
# AsOfSystemInterval rather than using CockroachDB's bounded-staleness form.
# If you want true bounded staleness (matching the choice made in
# 1786433405_add_postgres_aost_bounded.yml), replace the return with:
#   return " AS OF SYSTEM TIME with_max_staleness('" + (-interval).String() + "') "
# Be aware CockroachDB restricts bounded-staleness reads to single-statement
# implicit transactions that do not require a distributed scan.
rule:
  pattern: switch impl { $$$CASES }
  inside:
    stopBy: end
    pattern:
      context: "func (impl Implementation) AsOfSystemIntervalBounded(interval time.Duration) string { $$$ }"
      selector: method_declaration
  # self-disabling: skip if the Postgres case is already present
  not:
    regex: 'case Postgres:'

fix: |-
  switch impl {
  	case Postgres:
  		return impl.AsOfSystemInterval(interval)
  	$$$CASES	}
